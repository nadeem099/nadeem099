<text class="ln t0" x="58" y="200" fill="#38BDF8">Full stack engineer  ·  React · Node · Go</text><rect class="c0" x="58" y="187" width="9" height="17" fill="#38BDF8" opacity="0"/><text class="ln t1" x="58" y="200" fill="#A78BFA">I build RAG systems that cite their sources</text><rect class="c1" x="58" y="187" width="9" height="17" fill="#A78BFA" opacity="0"/><text class="ln t2" x="58" y="200" fill="#34D399">Streaming LLM APIs with real backpressure</text><rect class="c2" x="58" y="187" width="9" height="17" fill="#34D399" opacity="0"/><text class="ln t3" x="58" y="200" fill="#FBBF24">Typed, traced, tested  —  or it doesn't ship</text><rect class="c3" x="58" y="187" width="9" height="17" fill="#FBBF24" opacity="0"/>

